<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>{{ title }} - Nandi's archive</title>
        <link rel="alternate" type="application/rss+xml" title="Nandi's Archive RSS Feed" href="https://tripnv.github.io/nandisarchive/feed.xml" />
        <style>
            body {
                font-family: "Times New Roman", Times, serif;
                line-height: 1.3;
                color: #fff;
                max-width: 650px;
                margin: 40px auto;
                padding: 0 20px;
                background-color: #000;
                display: flex;
                flex-direction: column;
                min-height: 90vh;
            }

            main {
                flex: 1;
            }

            h1,
            h2,
            h3 {
                color: #fff;
                margin-top: 1.5rem;
                margin-bottom: 0.5rem;
            }

            p {
                margin-bottom: 0.8rem;
            }

            img {
                max-width: 100%;
                height: auto;
                margin: 1rem 0;
            }

            .post-section {
                margin-top: 0.5rem;
                border-top: 1px solid #333;
                padding-top: 1rem;
            }

            .post-date {
                color: #666;
                font-size: 0.9rem;
                margin-bottom: 1.5rem;
            }

            /* Hyperlinks */
            a,
            a:visited {
                color: #99ccff;
                text-decoration: underline;
            }

            a:hover {
                color: #2277ff;
            }

            nav a {
                text-decoration: none;
            }

            footer {
                margin-top: 1rem;
                border-top: 1px solid #333;
                padding-top: 0.2rem;
                display: flex;
                justify-content: flex-end;
                gap: 2rem;
                font-size: 0.9rem;
            }

            footer a {
                color: #666;
                text-decoration: none;
                display: flex;
                align-items: center;
            }

            footer a svg {
                fill: #666;
            }

            footer a:hover {
                color: #fff;
            }

            footer a:hover svg {
                fill: #fff;
            }
        </style>
    </head>
    <body>
        <main>
            <section>
                <nav style="text-align: right; font-size: 0.9rem; margin-bottom: 0.2rem">
                    <a href="../index.html">Archive</a> &nbsp; &nbsp;
                    <a href="../about.html">About me</a>
                </nav>
            </section>
            <article class="post-section">
                <h1>{{ title }}</h1>
                <div class="post-date">
                    <!-- djlint:off -->{{ created_display }}{% if modified_display %}, updated at {{ modified_display }}{% endif %}<!-- djlint:on -->
                </div>
                <div class="post-content">{{ content }}</div>
            </article>
        </main>
        <footer>
            <a href="../feed.xml" aria-label="RSS">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="12" height="12">
                  <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="5.5" cy="18.5" r="2.5" fill="currentColor" stroke="none"/>
                    
                    <path d="M5.5 11.5 A 7 7 0 0 1 12.5 18.5"/>
                    
                    <path d="M5.5 5.5 A 13 13 0 0 1 18.5 18.5"/>
                  </g>
                </svg>
            </a>
        </footer>
    </body>
</html>
