<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Nandi's archive</title>
        <link rel="alternate"
              type="application/rss+xml"
              title="Nandi's Archive RSS Feed"
              href="https://tripnv.github.io/nandisarchive/feed.xml" />
        <style>
            body {
                font-family: "Times New Roman", Times, serif;
                line-height: 1.3;
                color: #fff;
                max-width: 650px;
                margin: 40px auto;
                padding: 0 20px;
                background-color: #000;
                display: flex;
                flex-direction: column;
                min-height: 90vh;
            }

            main {
                flex: 1;
            }

            h1 {
                font-size: 2rem;
                margin-bottom: 0.8rem;
                color: #fff;
            }

            p {
                margin-bottom: 0.8rem;
            }

            h3 {
                font-weight: normal;
                font-size: 1.1rem;
                margin-bottom: 0.5rem;
            }

            .blog-section {
                margin-top: 0.5rem;
                border-top: 1px solid #333;
                padding-top: 1rem;
            }

            .blog-section h2 {
                font-size: 1.5rem;
                margin-bottom: 0.8rem;
            }

            ul {
                margin-left: 1rem;
                padding-left: 0;
                margin-bottom: 0.8rem;
            }

            .no-bullets {
                list-style-type: none;
                margin-left: 0;
            }

            li {
                margin-bottom: 0.1rem;
                display: flex;
                justify-content: space-between;
                align-items: baseline;
            }

            li span {
                color: #666; /* Subtle grey for dates */
                font-size: 0.9rem;
                margin-left: 1rem;
            }

            /* Hyperlinks - Light blue default, vibrant blue hover */
            a,
            a:visited {
                color: #99ccff;
                text-decoration: underline;
            }

            a:hover {
                color: #2277ff;
            }

            nav a {
                text-decoration: none;
            }

            footer {
                margin-top: 1rem;
                border-top: 1px solid #333;
                padding-top: 0.2rem;
                display: flex;
                justify-content: flex-end;
                gap: 2rem;
                font-size: 0.9rem;
            }

            footer a {
                text-decoration: none;
            }
        </style>
    </head>
    <body>
        <main>
            <section>
                <nav style="text-align: right; font-size: 0.9rem; margin-bottom: 0.2rem">
                    <span style="color: #fff">Archive</span> &nbsp; &nbsp;
                    <a href="about.html">About me</a>
                </nav>
            </section>
            <section class="blog-section">
                <h3>Things I've encountered, ideas I have played around with:</h3>
                <ul class="no-bullets">
                    <li>
                        <a href="posts/ffmpeg-on-mobile.html">ffmpeg on mobile</a>
                        <span>2026-01-01</span>
                    </li>
                    <li>
                        <a href="posts/the-beauty-of-simple-html.html">The Joy of Simple HTML</a>
                        <span>2026-01-01</span>
                    </li>
                </ul>
            </section>
        </main>
        <footer>
            <a href="mailto:nandorbirta@gmail.com">Contact me</a>
            <a href="feed.xml">RSS</a>
        </footer>
    </body>
</html>
